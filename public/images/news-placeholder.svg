<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
    <defs>
        <!-- Background Gradients -->
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="50%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#090d16"/>
        </linearGradient>
        <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#d97706"/>
            <stop offset="50%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#fbbf24"/>
        </linearGradient>
        <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
        </linearGradient>

        <!-- Subtle Grid Pattern -->
        <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
        </pattern>
    </defs>

    <!-- Main Canvas Background -->
    <rect width="1200" height="675" fill="url(#bg-grad)"/>
    <rect width="1200" height="675" fill="url(#grid-pattern)"/>

    <!-- Decorative Ambient Glows -->
    <circle cx="150" cy="120" r="220" fill="#f59e0b" fill-opacity="0.05" filter="blur(60px)"/>
    <circle cx="1050" cy="550" r="280" fill="#2563eb" fill-opacity="0.08" filter="blur(70px)"/>

    <!-- Top & Bottom Accent Borders -->
    <rect x="0" y="0" width="1200" height="6" fill="url(#gold-grad)"/>
    <rect x="0" y="669" width="1200" height="6" fill="url(#gold-grad)"/>

    <!-- Center Card Panel -->
    <g transform="translate(300, 140)">
        <rect x="0" y="0" width="600" height="395" rx="28" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

        <!-- Emblem / Badge Circle -->
        <g transform="translate(300, 110)">
            <circle cx="0" cy="0" r="54" fill="#0f172a" stroke="url(#gold-grad)" stroke-width="3"/>
            <circle cx="0" cy="0" r="44" fill="#ffffff" fill-opacity="0.04"/>

            <!-- Newspaper / News Icon -->
            <path d="M-20 -18 H12 A6 6 0 0 1 18 -12 V16 A4 4 0 0 1 14 20 H-16 A4 4 0 0 1 -20 16 V-18 Z" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M-14 -8 H8 M-14 -2 H8 M-14 4 H0 M-14 10 H8" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 -12 V14 A2 2 0 0 1 10 16 H-16" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
        </g>

        <!-- Organization Name & Badge -->
        <g transform="translate(300, 205)" text-anchor="middle">
            <!-- Pill Tag -->
            <rect x="-95" y="0" width="190" height="28" rx="14" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
            <text x="0" y="18" fill="#fbbf24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2">DOKUMENTASI RESMI</text>
        </g>

        <!-- Main Title -->
        <text x="300" y="270" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="1">
            PORTAL BEM TERPADU
        </text>

        <!-- Subtitle -->
        <text x="300" y="302" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
            Warta, Pengumuman &amp; Publikasi Mahasiswa
        </text>

        <!-- Decorative Divider -->
        <path d="M220 330 L380 330" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Corner Watermark Stamp -->
    <text x="60" y="620" fill="#64748b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">
        BADAN EKSEKUTIF MAHASISWA
    </text>
    <text x="1140" y="620" text-anchor="end" fill="#64748b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">
        KABINET INTEGRITAS &amp; AKSI
    </text>
</svg>
